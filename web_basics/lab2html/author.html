<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Про автора — Лабораторна №2</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- === ШАПКА СТОРІНКИ (заголовок) === -->
  <header class="page-header">
    <h1>Про автора</h1>
  </header>

  <!-- === ОСНОВНИЙ ВМІСТ === -->
  <main class="container">

    <!-- Блок з основним фото автора -->
    <!-- Порада: заміни images/me.jpg на своє зображення у папці images -->
    <figure class="author-photo">
      <img src="xd.jpg" alt="Фото автора" width="300" />
      <figcaption>Моє фото (демо-зображення)</figcaption>
    </figure>

    <!-- Посилання «Додому» з іконкою будиночка -->
    <p class="home-link">
      <a href="index.html" title="Перейти на головну сторінку" class="home-anchor">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Home_icon_orange.png"
          alt="Іконка будиночка"
          width="32"
          class="home-icon"
        />
        На головну
      </a>
    </p>

  </main>

  <!-- === ПІДВАЛ (за бажанням) === -->
  <footer class="page-footer">
    <small>Лабораторна робота №2</small>
  </footer>
</body>
</html>
